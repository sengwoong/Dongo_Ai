program:
  name: "영어 단어 학습 도우미"
  description: "영어 단어장 생성 프로그램"

model:
  provider: "openai"  # openai | ollama
  name: "gpt-4o-mini"
  context_length: 2048
  temperature: 0.7
  top_p: 0.9
  max_tokens: 500
  # api_base: "https://api.openai.com/v1"  # provider가 openai일 때만 사용

commands:
  - name: "generate_vocabulary"
    description: "영어 단어장 생성"
    prompt_template: |
      {school_level} 학생을 위한 {topic} 주제의 영어 단어장을 {count}개 생성해주세요.

      생성 조건:
      - 주제: {topic}
      - 난이도: {school_level}
      - 언어: {language}

      출력 규칙(아주 중요):
      - 출력은 정확히 {count}줄만 작성하세요.
      - 각 줄은 정확히 "[영단어]: [한국어 의미]" 형식이어야 합니다.
      - 의미는 반드시 한국어로만 작성합니다. 발음기호/영어/괄호 설명/한자 금지.
      - 추가 설명, 번호, 기호, 빈 줄, 코드블록 등은 절대 포함하지 마세요.

      예시(형식 참고):
      apple: 사과
      book: 책
    parameters:
      - name: "count"
        description: "생성할 단어 개수"
        type: "integer"
        default: 10
      - name: "school_level"
        description: "학교 수준"
        type: "string"
        choices: ["초등", "중등", "고등"]
        default: "중등"
      - name: "topic"
        description: "단어장 주제"
        type: "string"
        choices: ["음식", "동물", "여행", "학교", "가족", "취미", "직업", "색상", "숫자", "날씨", "운동", "음악", "영화", "책", "기술", "자연", "도시", "집", "옷", "교통"]
        default: "일반"
      - name: "language"
        description: "언어"
        type: "string"
        choices: ["영어", "한국어", "일본어", "중국어"]
        default: "영어"

  - name: "generate_vocabulary_options"
    description: "단어와 의미에 맞는 선택지 생성"
    prompt_template: |
      당신은 영어 단어장 선택지 생성 AI입니다. 다음 영어 단어의 의미에 맞는 객관식 문제의 선택지를 생성해주세요.

      단어: {word}
      의미: {meaning}

      정답은 '{meaning}'입니다. 오답 3개를 추가로 생성해주세요.
      오답은 정답과 같은 카테고리에 속하는 단어여야 하며, 정답과 중복되지 않아야 합니다.

      선택지 생성 규칙:
      1. 선택지는 모두 한국어로만 작성하세요. 절대 영어 단어를 사용하지 마세요.
      2. 선택지는 단어로만 작성하세요 (10자 이내).
      3. 선택지에 번호나 기호를 붙이지 마세요 (예: '1.', '*', '-' 등).
      4. 선택지에 영어 단어나 설명을 포함하지 마세요.
      5. 선택지는 쉼표로만 구분하세요.
      6. 모든 선택지는 반드시 한국어로만 작성해야 합니다.
      7. 발음 표기나 괄호 설명을 포함하지 마세요. (예: '사과 (sa-gwa)' → '사과')
      8. 하이픈(-) 뒤에 영어 단어를 포함하지 마세요. (예: '사과 - Apple' → '사과')
      9. 정답을 두 번 포함하지 마세요.

      예를 들어, 'apple'의 의미가 '사과'라면 다음과 같이 응답하세요:
      사과, 바나나, 오렌지, 포도

      'dog'의 의미가 '개'라면 다음과 같이 응답하세요:
      개, 고양이, 토끼, 말

      반드시 다음 형식으로만 응답하세요:
      {meaning}, [한국어 오답1], [한국어 오답2], [한국어 오답3]

      다른 설명이나 추가 텍스트 없이 위 형식으로만 정확히 응답하세요. 절대 영어 단어를 포함하지 마세요.
    parameters:
      - name: "word"
        description: "영어 단어"
        type: "string"
        required: true
      - name: "meaning"
        description: "단어의 한국어 의미"
        type: "string"
        required: true
