input {
  jdbc {
    jdbc_driver_library => "/usr/share/logstash/logstash-core/lib/jars/mysql-connector-j-8.4.0.jar"
    jdbc_driver_class => "com.mysql.cj.jdbc.Driver"
    jdbc_connection_string => "jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DB}?characterEncoding=UTF-8&serverTimezone=UTC"
    jdbc_user => "${MYSQL_USER}"
    jdbc_password => "${MYSQL_PASSWORD}"
    schedule => "*/2 * * * *" # 2분마다
    statement => "SELECT p.id, p.title, p.content, p.image_url, p.type, p.category, p.is_shared, p.is_ad, p.like_count, p.comment_count, p.user_id, p.created_at, p.updated_at, GREATEST(COALESCE(p.updated_at, '1970-01-01'), p.created_at) AS last_ts FROM posts p WHERE p.is_shared = 1 AND GREATEST(COALESCE(p.updated_at, '1970-01-01'), p.created_at) > :sql_last_value ORDER BY last_ts"
    use_column_value => true
    tracking_column => "last_ts"
    tracking_column_type => "timestamp"
    last_run_metadata_path => "/usr/share/logstash/.logstash_jdbc_last_run_posts"
    jdbc_default_timezone => "UTC"
    clean_run => false
  }
}

filter {
  mutate {
    # 인덱싱 전 필드 정리
    convert => { "is_shared" => "boolean" "is_ad" => "boolean" "like_count" => "integer" "comment_count" => "integer" }
    rename => { "user_id" => "userId" "image_url" => "imageUrl" "like_count" => "likeCount" "comment_count" => "commentCount" "created_at" => "createdAt" "updated_at" => "updatedAt" }
    add_field => { "model" => "post" }
  }
}

output {
  elasticsearch {
    hosts => ["${ELASTICSEARCH_HOST}"]
    index => "posts-shared"
    document_id => "%{id}"
    action => "update"
    doc_as_upsert => true
  }
  stdout { codec => rubydebug }
}


